version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: zero-trust-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zerotrust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zero-trust-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zero-trust-backend
    environment:
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zerotrust
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super_secure_docker_compose_jwt_secret_key_12345
      JWT_ACCESS_EXPIRE_MINUTES: 15
      JWT_REFRESH_EXPIRE_DAYS: 7
      MFA_ISSUER: ZeroTrustSystem
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zero-trust-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
